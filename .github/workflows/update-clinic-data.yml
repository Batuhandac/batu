name: Klinik verisini güncelle (OpenStreetMap + oda listeleri)

# Uygulamanın çevrimdışı klinik listelerini yeniler ve değişiklik varsa aynı
# branch'e commit'ler:
# - lib/data/clinics.ts: OpenStreetMap
# - lib/data/chamberClinics.ts: veteriner hekimleri odası listeleri; yalnızca
#   yeni adresler konumlanır (scripts/data/geocode-cache.json)
# - Manuel: Actions → bu workflow → Run workflow
# - Otomatik: her ayın 1'i (main), ya da üretici script değişince (her branch)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"
  push:
    paths:
      - scripts/gen-clinics-osm.js
      - scripts/gen-clinics-chamber.js
      - .github/workflows/update-clinic-data.yml

permissions:
  contents: write

concurrency:
  group: clinic-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: OpenStreetMap'ten klinikleri indir
        continue-on-error: true
        run: node scripts/gen-clinics-osm.js

      # Konumlama yavaş (saniyede 1 istek); push'ta değil, ayda bir ve elle çalışır
      - name: Oda listelerini indir ve yeni adresleri konumla
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/gen-clinics-chamber.js

      - name: Değişiklik varsa commit'le
        run: |
          FILES="lib/data/clinics.ts lib/data/chamberClinics.ts scripts/data/geocode-cache.json"
          if git diff --quiet -- $FILES; then
            echo "Klinik verisinde değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "data: klinik verisi güncellendi"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
