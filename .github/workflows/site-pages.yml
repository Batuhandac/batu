name: Site → GitHub Pages

# Gizlilik, kullanım koşulları, destek ve hekim tanıtım sayfalarını (site/) ve
# hekim panelini (uygulamanın web sürümü, /app/panel) yayınlar. Yalnızca herkese açık
# Batuhandac/batu deposunda çalışır (Settings → Pages → Source: "GitHub Actions").
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Batuhandac/batu'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hekim panelini derle (web)
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          EXPO_BASE_URL=/batu/app npx expo export --platform web --output-dir dist-web
          mkdir -p site/app
          cp -R dist-web/. site/app/
          # Tek sayfalık uygulama: /app/panel/hasta/… gibi adresler yenilenince
          # GitHub Pages 404.html'i sunar; o da uygulamayı açıp doğru ekrana gider.
          cp dist-web/index.html site/404.html

      # Pages kapalıysa açmayı dener (Source: GitHub Actions). Depo ayarı buna
      # izin vermezse bir kez Settings → Pages → Source: "GitHub Actions" seçilir.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
