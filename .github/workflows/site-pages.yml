name: Site → GitHub Pages

# Gizlilik, kullanım koşulları, destek ve hekim tanıtım sayfalarını (site/) ve
# hekim panelini (uygulamanın web sürümü, /app/panel) yayınlar. Yalnızca herkese açık
# Batuhandac/batu deposunda çalışır (Settings → Pages → Source: "GitHub Actions").
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Batuhandac/batu'
    runs-on: ubuntu-latest
    env:
      # Ödeme sunucusu yalnızca Cloudflare ve iyzico secret'ları eklendiyse yayınlanır
      HAS_PAY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.IYZICO_API_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kartla ödeme (iyzico) için sunucu: server/odeme. Başarısız olursa site yine
      # yayınlanır, panelde yalnızca iyzico seçeneği görünmez.
      - name: Ödeme sunucusunu yayınla (Cloudflare Worker)
        id: pay
        if: env.HAS_PAY == 'true'
        continue-on-error: true
        working-directory: server/odeme
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Kopyala-yapıştırda gelen boşluk, satır sonu ya da Cloudflare'in "test"
          # komutu varsa içinden yalnızca token'ı ve hesap kimliğini al
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | grep -oE '[A-Za-z0-9_-]{40,}' | tail -1 || true)
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[a-fA-F0-9]{32}' | head -1 || true)
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN içinde token bulunamadı"; exit 1; fi
          if [ -z "$ACCOUNT" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID 32 karakterlik hesap kimliği değil"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL"
          # Secret'lar dosyaya yalnızca bu adım süresince yazılır
          node -e 'const e=process.env;require("fs").writeFileSync("s.json",JSON.stringify({IYZICO_API_KEY:e.IYZICO_API_KEY,IYZICO_SECRET_KEY:e.IYZICO_SECRET_KEY,FIREBASE_SERVICE_ACCOUNT:e.FIREBASE_SERVICE_ACCOUNT}))'
          if npx --yes wrangler@4 secret bulk s.json; then rc=0; else rc=1; fi
          rm -f s.json
          test $rc -eq 0
          curl -sS "$URL/health" || true; echo
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Hekim panelini derle (web)
        env:
          EXPO_PUBLIC_PAY_API_URL: ${{ steps.pay.outputs.url }}
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          EXPO_BASE_URL=/batu/app npx expo export --platform web --output-dir dist-web
          mkdir -p site/app
          cp -R dist-web/. site/app/
          # Tek sayfalık uygulama: /app/panel/hasta/… gibi adresler yenilenince
          # GitHub Pages 404.html'i sunar; o da uygulamayı açıp doğru ekrana gider.
          cp dist-web/index.html site/404.html

      # Pages kapalıysa açmayı dener (Source: GitHub Actions). Depo ayarı buna
      # izin vermezse bir kez Settings → Pages → Source: "GitHub Actions" seçilir.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
