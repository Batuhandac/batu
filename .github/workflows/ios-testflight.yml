name: iOS → TestFlight

# Manuel tetiklenir: GitHub → Actions sekmesi → bu workflow → "Run workflow"
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profili"
        required: true
        default: "production"

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: EAS CLI kur + Expo girişi
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bağımlılıkları yükle
        run: npm install --no-audit --no-fund

      - name: App Store Connect API anahtarını + EAS yapılandırmasını hazırla
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
        run: node scripts/ci-prepare-credentials.js

      - name: EAS projesini bağla
        run: eas init --non-interactive || true

      - name: iOS build + TestFlight gönderimi
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          eas build \
            --platform ios \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            --auto-submit
