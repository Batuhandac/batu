name: iOS → TestFlight

# Manuel tetiklenir (Actions → Run workflow, istediğin branch'i seçebilirsin),
# "ios-build-" ile başlayan bir etiket gönderilince (git tag ios-build-2026-10-03 &&
# git push origin ios-build-2026-10-03; etiketlerde dosya filtresine bakılmaz)
# VEYA main'e push olunca otomatik. Yalnızca site, belge, iş akışı ya da veri
# üreticisi değiştiyse derleme yapılmaz (EAS derleme hakkı boşa gitmesin);
# gerekirse elle çalıştırılır.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profili"
        required: true
        default: "production"
  push:
    branches:
      - main
    tags:
      - "ios-build-*"
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "marketing/**"
      - "store/**"
      - "**/*.md"
      - ".github/**"
      - "scripts/data/**"
      - "scripts/gen-clinics-osm.js"
      - "scripts/gen-clinics-chamber.js"
      # Yalnızca web hekim paneline ait dosyalar iOS derlemesi başlatmaz
      - "app/panel/**"
      - "components/panel/**"
      - "lib/pos/**"
      - "server/**"
      - "firestore.rules"

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: EAS CLI kur + Expo girişi
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: App Store Connect API anahtarını + EAS yapılandırmasını hazırla
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_GOOGLE_PLACES_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
        run: node scripts/ci-prepare-credentials.js

      - name: iOS build + TestFlight gönderimi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
        run: |
          case "$PROFILE" in
            production|preview|development) ;;
            *) echo "Bilinmeyen profil: $PROFILE"; exit 1 ;;
          esac
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --auto-submit
