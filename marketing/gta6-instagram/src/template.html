<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"Inter";src:local("Inter");}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:"Inter","Inter Display",sans-serif;color:#fff}
  body.square{height:1080px}
  body.story{height:1920px}
  .bg{position:absolute;inset:0;background:linear-gradient(#070516 0%,#1a0b3a 45%,#4a1150 70%,#0b0820 100%)}
  .sun{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:760px;height:760px;border-radius:50%;
       background:linear-gradient(#ffe08a 0%,#ff7a45 40%,#ff2d95 100%);opacity:.95;
       -webkit-mask-image:repeating-linear-gradient(#000 0 42px,transparent 42px 54px);mask-image:repeating-linear-gradient(#000 0 42px,transparent 42px 54px);
       filter:drop-shadow(0 0 80px rgba(255,45,149,.7))}
  body.story .sun{top:30%}
  body.text .sun{opacity:.4;top:34%;filter:drop-shadow(0 0 60px rgba(255,45,149,.4))}
  body.square .sun{top:14%}
  .haze{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(transparent 55%,rgba(11,8,32,.9) 100%)}
  .grid{position:absolute;left:-40%;right:-40%;bottom:0;height:42%;
      background-image:linear-gradient(rgba(0,229,255,.45) 2px,transparent 2px),linear-gradient(90deg,rgba(0,229,255,.45) 2px,transparent 2px);
      background-size:100% 70px,120px 100%;transform:perspective(700px) rotateX(62deg);transform-origin:50% 0;
      -webkit-mask-image:linear-gradient(rgba(0,0,0,.9),transparent);mask-image:linear-gradient(rgba(0,0,0,.9),transparent)}
  .palms{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,rgba(6,4,26,.95) 85%)}
  .wrap{position:absolute;inset:0;padding:96px 88px;display:flex;flex-direction:column;justify-content:space-between}
  .tag{display:inline-block;align-self:flex-start;padding:14px 26px;border:2px solid rgba(0,229,255,.9);color:#00e5ff;border-radius:999px;font-size:30px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;background:rgba(0,0,0,.25)}
  h1{font-size:200px;line-height:.9;font-weight:900;letter-spacing:-.04em;text-shadow:0 0 40px rgba(255,45,149,.6)}
  h1.small{font-size:120px}
  h1.xs{font-size:96px}
  .sub{font-size:48px;font-weight:600;line-height:1.2;color:#ffe9f4;max-width:900px;margin-top:28px}
  .sub.muted{color:#d9c8ff;font-weight:500;font-size:40px}
  .footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:30px;color:#cfd8ff;letter-spacing:.06em}
  .footer b{color:#fff;font-size:36px}
  .footer .disc{font-size:22px;color:#9aa3c7;letter-spacing:.02em;max-width:560px;text-align:right}
  .num{font-size:620px;line-height:.8;font-weight:900;letter-spacing:-.08em;
       background:linear-gradient(#fff,#ffb3d9 55%,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 0 60px rgba(255,45,149,.55))}
  .list{margin-top:40px;display:flex;flex-direction:column;gap:26px}
  .item{display:flex;gap:28px;align-items:flex-start;font-size:40px;line-height:1.25;color:#fff}
  .item i{flex:none;width:64px;height:64px;border-radius:16px;background:#00e5ff;color:#06041a;font-style:normal;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:34px}
  .phone{position:absolute;right:88px;bottom:230px;width:380px;height:640px;border-radius:64px;border:10px solid #1a1430;background:#0D1117;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(0,229,255,.4);overflow:hidden}
  .phone .bar{height:120px;background:linear-gradient(90deg,#ff2d95,#7b2cff);display:flex;align-items:center;padding:0 36px;font-weight:800;font-size:30px}
  .phone .row{margin:22px 30px;height:92px;border-radius:22px;background:#161b26;display:flex;align-items:center;padding:0 26px;font-size:24px;color:#cfd8ff;gap:18px}
  .phone .row span{width:44px;height:44px;border-radius:12px;background:#00e5ff;flex:none}
  .avatar{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center}
  .avatar .mono{font-size:520px;font-weight:900;letter-spacing:-.08em;text-shadow:0 0 80px rgba(0,229,255,.6)}
</style></head>
<body class="{{BODY_CLASS}}">
<div class="bg"></div><div class="sun"></div><div class="haze"></div><div class="grid"></div><div class="palms"></div>
<div class="wrap">{{CONTENT}}</div>
</body></html>
